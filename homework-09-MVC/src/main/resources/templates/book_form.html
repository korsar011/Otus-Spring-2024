<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${book.id == null ? 'Add New Book' : 'Edit Book'}">Book Form</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="form-container">
    <h1 th:if="${book.id == null}">Add New Book</h1>
    <h1 th:if="${book.id != null}">Edit Book</h1>
    <form th:action="@{/library/books/{id}(id=${book.id})}" th:object="${book}" method="post" class="form">
        <input type="hidden" th:field="*{id}"/>
        <div class="form-group">
            <label for="title">Title:</label>
            <input type="text" id="title" th:field="*{title}" class="form-control" required="required"/>
        </div>
        <div class="form-group">
            <label for="authorId">Author:</label>
            <select id="authorId" th:field="*{authorId}" class="form-control" required="required">
                <option th:each="author : ${authors}" th:value="${author.id}" th:text="${author.fullName}">Author Name</option>
            </select>
        </div>
        <div class="form-group">
            <label for="genreId">Genre:</label>
            <select id="genreId" th:field="*{genreId}" class="form-control" required="required">
                <option th:each="genre : ${genres}" th:value="${genre.id}" th:text="${genre.name}">Genre Name</option>
            </select>
        </div>
        <button type="submit" class="submit-button">Save</button>
    </form>
    <div class="button-group">
        <a href="/library/books" class="button">Back to Book List</a>
        <a href="/" class="button">Home</a>
    </div>
</div>
</body>
</html>
