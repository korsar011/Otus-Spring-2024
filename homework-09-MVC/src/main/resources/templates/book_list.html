<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books List</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="container">
    <h1>Books List</h1>
    <table class="data-table">
        <thead>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Genre</th>
            <th>Comments</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.title}">Book Title</td>
            <td th:text="${book.author.fullName}">Author Name</td>
            <td th:text="${book.genre.name}">Genre Name</td>
            <td class="comment-actions">
                <a th:href="@{/library/comments/by-book/{bookId}(bookId=${book.id})}" class="button">View Comments</a>
            </td>
            <td class="action-buttons">
                <a th:href="@{/library/books/edit/{id}(id=${book.id})}" class="edit-button">Edit</a>
                <form th:action="@{/library/books/delete/{id}(id=${book.id})}" method="post" style="display:inline;">
                    <input type="hidden" name="id" th:value="${book.id}"/>
                    <button type="submit" class="delete-button">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="button-group">
        <a href="/library/books/new" class="button">Add New Book</a>
        <a href="/" class="button">Home</a>
    </div>
</div>
</body>
</html>
