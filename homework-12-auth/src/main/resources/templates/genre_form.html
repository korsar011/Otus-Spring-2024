<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${genre.id == null ? 'Add New Genre' : 'Edit Genre'}">Genre Form</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="form-container">
    <h1 th:if="${genre.id == null}">Add New Genre</h1>
    <h1 th:if="${genre.id != null}">Edit Genre</h1>
    <form th:action="@{/library/genres}" th:object="${genre}" method="post" class="form">
        <input type="hidden" th:field="*{id}"/>
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" th:field="*{name}" class="form-control" required="required"/>
        </div>
        <button type="submit" class="submit-button">Save</button>
    </form>
    <div class="button-group">
        <a href="/library/genres" class="button">Back to Genre List</a>
        <a href="/" class="button">Home</a>
    </div>
</div>
</body>
</html>
