management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    logfile:
      enabled: true
    metrics:
      enabled: true
    health:
      show-details: always
  health:
    defaults:
      enabled: true
spring:
  datasource:
    url: jdbc:h2:mem:maindb
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none

    show-sql: true
  data:
    rest:
      base-path: /data-rest