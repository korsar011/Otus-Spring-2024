management:
  endpoints:
    web:
      exposure:
        include:
          - "health"
          - "metrics"
          - "logfile"
  endpoint:
    logfile:
      enabled: true
    metrics:
      enabled: true
    health:
      show-details: always
  health:
    defaults:
      enabled: true

spring:
  datasource:
    url: jdbc:h2:mem:maindb
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none
    show-sql: true

logging:
  file:
    name: logs/app.log
  level:
    root: INFO