<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments List</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="container">
    <h1>Comments</h1>
    <div th:if="${message}">
        <p th:text="${message}">No comments found for the specified book.</p>
    </div>
    <table class="data-table" th:if="${comments != null}">
        <thead>
        <tr>
            <th>Content</th>
            <th>Book Title</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="comment : ${comments}">
            <td th:text="${comment.content}">Comment Content</td>
            <td th:text="${comment.book.title}">Book Title</td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/library/books}" class="button">Back</a>
</div>
</body>
</html>
